services:
  - type: web
    name: moundweb-api
    runtime: node
    branch: main
    buildCommand: npm ci && npm run build --workspace @moundweb/shared && npm run build --workspace @moundweb/api
    startCommand: npm run start --workspace @moundweb/api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_ENABLED
        value: "false"
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: ADMIN_COOKIE_SAME_SITE
        value: Lax
      - key: TRUST_PROXY
        value: "true"
      - key: SUBMISSIONS_ENABLED
        value: "false"
      - key: APPROVED_PRIVACY_NOTICE_VERSION
        value: pending
