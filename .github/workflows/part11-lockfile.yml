name: Sync Part 11 dependency lockfile
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/api/package.json'
      - '.github/workflows/part11-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package-lock.json
            git commit -m "chore(lockfile): sync Prisma and Resend dependencies"
            git push origin HEAD:main
          fi
